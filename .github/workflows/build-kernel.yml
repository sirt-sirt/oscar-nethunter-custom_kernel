name: Build NetHunter kernel (oscar / SM6375)

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/**"

env:
  ARCH: arm64
  DEFCONFIG: vendor/holi-qgki_defconfig
  FRAGMENT: arch/arm64/configs/vendor/nethunter_oscar.config

  # ONE definition of the toolchain, shared by every make in this file.
  # Configure and Build must see the identical compiler, otherwise the config
  # we gate on is not the config we build. Kconfig resolves CC_IS_CLANG,
  # CLANG_VERSION and LD_IS_LLD while olddefconfig runs, and arch/Kconfig gates
  # LTO_CLANG on all three at once. Configure with the default gcc and the LTO
  # choice silently collapses to LTO_NONE, taking CFI_CLANG down with it. CFI
  # has to stay on, because stock rdbg.ko references __cfi_slowpath.
  KTC: >-
    LLVM=1 LLVM_IAS=1
    CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
    OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
    CROSS_COMPILE=aarch64-linux-gnu-
    CROSS_COMPILE_ARM32=arm-linux-gnueabi-
  LLVM: 1
  LLVM_IAS: 1

  # Run 32503060142 is what pinned this down. The gate verified that
  # out/.config held CONFIG_LOCALVERSION="-qgki-ge408f03a5c42", and
  # kernelrelease still came back "5.4.280-qgki". So scripts/setlocalversion
  # does not read .config at all. It does
  #   . include/config/auto.conf
  # and auto.conf is a mirror written by syncconfig, which was stale relative
  # to the merged .config. The earlier reading of this - "olddefconfig dropped
  # CONFIG_LOCALVERSION_AUTO" - was wrong. The fragment applied fine; the file
  # the script actually reads was simply out of date.
  #
  # setlocalversion builds the string as
  #   res="${res}${CONFIG_LOCALVERSION}${LOCALVERSION}"
  # so the hash now travels in the LOCALVERSION environment variable, which no
  # file staleness can touch, while CONFIG_LOCALVERSION stays at "-qgki" - the
  # value the base defconfig and the fragment both already carry. Stale or
  # fresh, auto.conf yields "-qgki" either way, so the answer is identical:
  #   5.4.280 + -qgki + -ge408f03a5c42
  # Exporting LOCALVERSION also suppresses the trailing plus sign, and run
  # 32484342984 proved the mechanism reaches the script: that run exported an
  # empty LOCALVERSION and the plus sign disappeared.
  LOCALVERSION: "-ge408f03a5c42"
  EXPECTED_CONFIG_LOCALVERSION: "-qgki"

  # The phone's stock vendor modules carry this exact string. Reproducing it
  # byte for byte is what lets rdbg.ko keep loading - that is the one module
  # whose source was never located in this tree, so it stays stock. Everything
  # else in modules.load is rebuilt here, the four rmnet modules included:
  # techpack/datarmnet/core and techpack/datarmnet-ext/{offload,shs} declare
  # them with an unconditional obj-m, so their CRCs match by construction.
  EXPECTED_RELEASE: "5.4.280-qgki-ge408f03a5c42"
  EXPECTED_VERMAGIC: "5.4.280-qgki-ge408f03a5c42 SMP preempt mod_unload modversions aarch64"

  KBUILD_BUILD_USER: nethunter
  KBUILD_BUILD_HOST: builder

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore the executable bit on the build scripts
        run: |
          set -eu
          # ---------------------------------------------------------------
          # This is what killed runs 32481952672 and 32482784430 after ~2 min:
          #   sh: 1: ../scripts/gcc-version.sh: Permission denied
          #   init/Kconfig:35: syntax error
          #   make[2]: *** [vendor/holi-qgki_defconfig] Error 1
          #
          # Every blob in this repository is stored with mode 100644, so the
          # helper scripts Kconfig executes directly are not executable after
          # checkout. init/Kconfig contains
          #   default $(shell,$(srctree)/scripts/gcc-version.sh $(CC)) if CC_IS_GCC
          # and when the script cannot run the expansion comes back empty, so
          # the line degenerates into "default  if CC_IS_GCC" - hence the syntax
          # error on the very first make, long before any gate can run.
          #
          # The mode is wrong in the tree itself and cannot be corrected through
          # the API these files are pushed with, so it is repaired on every
          # checkout. The same repair for a local clone is:
          #   find . -name '*.sh' -exec chmod +x {} +
          # ---------------------------------------------------------------
          find . -path ./.git -prune -o -type f \
            \( -name '*.sh' -o -name '*.pl' -o -name '*.py' \) \
            -exec chmod +x {} +

          # Extensionless helpers under scripts/ - anything with a shebang.
          find scripts -type f | while read -r f; do
            if [ "$(head -c 2 "$f" 2>/dev/null)" = '#!' ]; then
              chmod +x "$f"
            fi
          done

          # Named one by one because Kconfig and the final link invoke these by
          # path, and a silent miss here costs an entire build.
          fail=0
          for f in scripts/gcc-version.sh scripts/clang-version.sh \
                   scripts/gcc-plugin.sh scripts/ld-version.sh \
                   scripts/tools-support-relr.sh scripts/cc-can-link.sh \
                   scripts/setlocalversion scripts/mkcompile_h \
                   scripts/link-vmlinux.sh scripts/depmod.sh \
                   scripts/kconfig/merge_config.sh; do
            if [ ! -e "$f" ]; then
              echo "  absent  $f"
            elif [ -x "$f" ]; then
              echo "  ok +x   $f"
            else
              echo "::error::$f is still not executable"
              fail=1
            fi
          done
          exit "$fail"

      - name: Install build dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex make gcc git zip unzip cpio \
            libssl-dev libelf-dev python3 python-is-python3

      - name: Fetch Proton Clang
        run: |
          set -eu
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$HOME/tc"
          echo "$HOME/tc/bin" >> "$GITHUB_PATH"

      - name: Restore kernel/module.c from the last clean revision
        run: |
          set -eu

          # Run 32514819779 died here, 4924 log lines in:
          #   ../kernel/module.c:1311:1: error: non-void function does not
          #     return a value [-Werror,-Wreturn-type]
          #   ../kernel/module.c:1338:1: error: (same)
          #
          # The previous step deleted the two lines
          #   return 1; /* FORCE ACCEPT ALL CRCS */
          #   return 1; /* FORCE ACCEPT ALL VERMAGICS */
          # assuming commit eddbb4a had merely inserted them above the original
          # code. Its diff confirms exactly that: two pure additions, zero
          # deletions. Deleting them should therefore have restored the
          # original behaviour - and the -Wreturn-type errors prove it did not,
          # because in the current tree neither function has any other return
          # statement left. Some later commit gutted both bodies as well, and
          # sed cannot put back code that is no longer in the file.
          #
          # So take the whole file from the last revision known to be clean,
          # the parent of eddbb4a, rather than repairing the current one. Later
          # edits to module.c are discarded on purpose: every commit that
          # touched this file was chasing the bootloop and made it worse.
          CLEAN=afaab8dd8cfd1a139f0a5faea2c8e85ba9a474ea

          git fetch --depth=1 origin "$CLEAN" 2>/dev/null \
            || { git fetch --unshallow origin || true; git fetch origin "$CLEAN"; }
          git checkout "$CLEAN" -- kernel/module.c

          # Prove the restored file is the real thing and not another stub. The
          # first two strings live inside check_version(), the third inside
          # same_magic() - precisely the code that must exist for the kernel to
          # refuse a module whose symbol CRCs or vermagic disagree. Asserting on
          # content rather than on "sed exited 0" is the lesson from this run.
          fail=0
          for s in 'disagrees about version of symbol' \
                   'no symbol version for' \
                   'amagic += strcspn(amagic, " ")'; do
            if grep -qF "$s" kernel/module.c; then
              echo "  ok      present: $s"
            else
              echo "::error::restored kernel/module.c lacks: $s"
              fail=1
            fi
          done

          if grep -q 'FORCE ACCEPT ALL' kernel/module.c; then
            echo "::error::the force-accept hack is still present"
            fail=1
          else
            echo "  ok      no force-accept hack"
          fi

          n=$(wc -l < kernel/module.c)
          echo "  lines   $n in kernel/module.c"
          if [ "$n" -lt 3000 ]; then
            echo "::error::kernel/module.c is only $n lines - looks gutted"
            fail=1
          fi

          exit "$fail"

      - name: Configure
        run: |
          set -eu

          make -j"$(nproc)" O=out ARCH=arm64 $KTC "$DEFCONFIG"

          # Only one pin belongs here now. CONFIG_LOCALVERSION_AUTO=y would
          # call scm_version() and append a git hash on top of the
          # LOCALVERSION supplied from the environment, giving a doubled
          # suffix. The fragment asks for it, this overrides it, and
          # merge_config.sh will print a "redefined by fragment" notice for it.
          # That notice is expected. CONFIG_LOCALVERSION itself is left exactly
          # as the fragment and the base defconfig have it, "-qgki".
          printf '%s\n' '# CONFIG_LOCALVERSION_AUTO is not set' > /tmp/release.config

          ARCH=arm64 bash scripts/kconfig/merge_config.sh -m -O out \
            out/.config "$FRAGMENT" /tmp/release.config
          make -j"$(nproc)" O=out ARCH=arm64 $KTC olddefconfig

          # Force include/config/auto.conf and include/generated/autoconf.h to
          # be rewritten from the merged .config. auto.conf is the file
          # setlocalversion sources, and autoconf.h is what the compiler
          # actually sees, so a stale pair means building something other than
          # what the gate below inspects. Run 32503060142 shipped a stale
          # auto.conf and that alone produced the wrong release string.
          make -j"$(nproc)" O=out ARCH=arm64 $KTC syncconfig

          echo "=== .config vs auto.conf on the release symbols ==="
          grep -E '^(# )?CONFIG_LOCALVERSION' out/.config || true
          if [ -f out/include/config/auto.conf ]; then
            grep -E '^(# )?CONFIG_LOCALVERSION' out/include/config/auto.conf \
              || echo "  auto.conf carries no LOCALVERSION line"
            ls -l --time-style=+%H:%M:%S out/.config out/include/config/auto.conf
          else
            echo "  auto.conf absent - setlocalversion would have refused to run"
          fi

          echo "=== toolchain as Kconfig resolved it ==="
          grep -E '^(# )?CONFIG_(CC_IS_CLANG|CLANG_VERSION|CC_IS_GCC|GCC_VERSION|LD_IS_LLD|LD_VERSION)\b' out/.config || true

          # Every positive symbol the fragment asks for that is missing from the
          # resolved config. Empty means everything survived. A long list means
          # the fragment is not being applied the way we think, and the symbol
          # checks in the next step would be lying about the cause.
          # LOCALVERSION_AUTO is skipped because it is overridden just above.
          echo "=== fragment symbols dropped by olddefconfig ==="
          dropped=$(grep -E '^CONFIG_[A-Za-z0-9_]+=' "$FRAGMENT" \
            | grep -v '^CONFIG_LOCALVERSION_AUTO=' \
            | while IFS= read -r line; do
                grep -qxF "$line" out/.config || echo "$line"
              done)
          if [ -n "$dropped" ]; then
            printf '%s\n' "$dropped" | sed 's/^/  DROPPED: /'
            echo "  total dropped: $(printf '%s\n' "$dropped" | wc -l)"
          else
            echo "  none - every symbol the fragment asked for survived"
          fi

      - name: Gate - release string and critical symbols
        run: |
          set -eu

          fail=0

          # The hash reaches setlocalversion through this variable, not through
          # any file, so confirm it is actually present in the environment
          # before trusting the release string below.
          echo "LOCALVERSION env : [${LOCALVERSION-(unset)}]"
          if [ "${LOCALVERSION-}" != "-ge408f03a5c42" ]; then
            echo "::error::LOCALVERSION must be -ge408f03a5c42 in the job environment"
            fail=1
          fi

          rel=$(make -s O=out ARCH=arm64 $KTC kernelrelease 2>/dev/null | tail -1)
          echo "kernelrelease  : $rel"
          echo "device expects : $EXPECTED_RELEASE"
          if [ "$rel" != "$EXPECTED_RELEASE" ]; then
            echo "::error::release mismatch - every stock vendor module would be refused."
            fail=1
          fi

          # Deliberately no exit here. Every failed run costs a round trip of
          # several minutes plus a hand-pasted log, so this step reports every
          # problem it can see and exits once, at the very end.

          if grep -qx 'CONFIG_LOCALVERSION_AUTO=y' out/.config; then
            echo "::error::CONFIG_LOCALVERSION_AUTO=y appends a git hash after LOCALVERSION"
            fail=1
          else
            echo "  ok      CONFIG_LOCALVERSION_AUTO is off, as intended"
          fi

          check() {
            if ! grep -qx "CONFIG_$1=$2" out/.config; then
              got=$(grep -E "^(# )?CONFIG_$1[ =]" out/.config || echo "absent")
              echo "::error::CONFIG_$1 should be $2 but is: $got"
              fail=1
            else
              echo "  ok      CONFIG_$1=$2"
            fi
          }

          # Deliberately "-qgki" and not the full string: the hash comes from
          # the environment, so this half must match what a stale auto.conf
          # would also say, otherwise the two disagree again.
          check LOCALVERSION "\"$EXPECTED_CONFIG_LOCALVERSION\""

          # These four spell out the second half of the vermagic string.
          check SMP y
          check PREEMPT y
          check MODULE_UNLOAD y
          check MODVERSIONS y

          # The Kali chroot needs these. HEAD dropped SYSVIPC and PID_NS trying
          # to cure the bootloop, which was a misdiagnosis - the bootloop came
          # from the forced CRC and vermagic acceptance in kernel/module.c.
          check SYSVIPC y
          check IPC_NS y
          check PID_NS y
          check NAMESPACES y

          # CFI must survive: stock rdbg.ko references __cfi_slowpath, and it is
          # the one module in modules.load that is not rebuilt here. CFI_CLANG
          # depends on LTO_CLANG, which in turn needs clang plus ld.lld, which
          # is why the toolchain is pinned in env rather than left to default.
          check LTO_CLANG y
          check CFI_CLANG y

          # Wi-Fi: the in-tree qcacld-3.0 driver, its dependencies, and the
          # platform glue the phone's firmware in /vendor/firmware/wlan/qca_cld
          # is loaded through.
          check STAGING y
          check QCA_CLD_WLAN m
          check CFG80211 y
          check MAC80211 y
          check ICNSS2 y
          check CNSS_GENL y
          check WCNSS_MEM_PRE_ALLOC y

          # Bluetooth: btpower.ko and bt_fm_slim.ko are both in modules.load,
          # and bt_fm_slim needs the SLIMbus core built in.
          check BT y
          check ARCH_QCOM y
          check MSM_BT_POWER m
          check BTFM_SLIM m
          check SLIMBUS y

          exit "$fail"

      - name: Export a standalone defconfig
        run: |
          set -eu
          # The fully resolved self-contained config: base defconfig plus our
          # fragment, minimised by kconfig itself. Downloadable from the run
          # artifacts as nethunter_oscar_defconfig.
          make -j"$(nproc)" O=out ARCH=arm64 $KTC savedefconfig
          cp out/defconfig nethunter_oscar_defconfig
          echo "standalone defconfig: $(wc -l < nethunter_oscar_defconfig) lines"

      # dtbo: this tree has no dtbo.img make target. arch/arm64/Makefile
      # exposes only Image / Image.gz / install / vdso, and
      # arch/arm64/boot/Makefile only Image plus compressed variants. dtbo.img
      # comes from Android mkdtimg, not from kernel make. AnyKernel replaces
      # the kernel only, so the stock dtbo partition stays untouched.
      - name: Build kernel and in-tree modules
        run: |
          set -eu
          set -o pipefail

          # The log is piped through tee so a failure can report itself. Run
          # 32511775897 ended at log line 2150 with nothing but
          #   make: *** [Makefile:190: sub-make] Error 2
          # at the tail. With -j the failing recipe's diagnostic is buried
          # hundreds of lines up, because make lets the jobs already in flight
          # finish before giving up - which is why fs/ appeared to compile fine
          # right before the failure. Hand-reading a 2000-line log to find the
          # real message is not a workflow, so the step digs it out itself.
          rc=0
          make -j"$(nproc)" O=out ARCH=arm64 $KTC Image modules 2>&1 \
            | tee /tmp/build.log || rc=$?

          if [ "$rc" != "0" ]; then
            echo "##################################################"
            echo "### build failed, rc=$rc - digging out the cause"
            echo "##################################################"

            echo "=== compiler and linker diagnostics ==="
            grep -nE ' (error|fatal error):|^ld\.lld: error:|undefined (symbol|reference)|relocation .* (out of range|truncated)|cannot find' \
              /tmp/build.log | head -60 || echo "  nothing matched"

            echo "=== make failure lines ==="
            grep -nE '^make(\[[0-9]+\])?: \*\*\*' /tmp/build.log | head -30 || true

            echo "=== context around the first diagnostic ==="
            n=$(grep -nE ' (error|fatal error):|^ld\.lld: error:' /tmp/build.log \
              | head -1 | cut -d: -f1 || true)
            if [ -n "${n:-}" ]; then
              s=1
              [ "$n" -gt 40 ] && s=$((n - 40))
              sed -n "${s},$((n + 40))p" /tmp/build.log
            else
              echo "  no diagnostic matched - last 150 lines instead:"
              tail -150 /tmp/build.log
            fi

            echo "=== log was $(wc -l < /tmp/build.log) lines ==="
            exit "$rc"
          fi

          echo "Image  : $(stat -c %s out/arch/arm64/boot/Image) bytes"
          echo "modules: $(find out -name '*.ko' | wc -l) built"

      # External RTL8188EUS for the TP-Link TL-WN722N v2, the only adapter here
      # that can do monitor mode and injection. Out-of-tree drivers regularly
      # fail against LTO/CFI, and that must not throw away a good kernel - so
      # this step may fail, but it may no longer fail SILENTLY. Run
      # 32518262085 produced one bare annotation, "Process completed with exit
      # code 2", which is not enough to fix anything.
      - name: Build RTL8188EUS (TL-WN722N v2)
        id: rtl
        continue-on-error: true
        run: |
          set -eu
          set -o pipefail
          git clone --depth=1 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eus

          # Facts about the driver's own Makefile, gathered before invoking it.
          # Which CONFIG_PLATFORM_* switches it actually defines decides whether
          # CONFIG_PLATFORM_ANDROID_ARM64=y selects anything at all, and the way
          # it recurses into the kernel decides whether our clang / ld.lld
          # toolchain survives the hand-off or gets replaced by a hardcoded gcc
          # prefix. Guessing at either of those has cost three rounds already.
          echo "=== platform switches this Makefile defines ==="
          grep -nE '^CONFIG_PLATFORM_[A-Z0-9_]+' rtl8188eus/Makefile | head -40 || true
          echo "=== toolchain and recursion lines ==="
          grep -nE '^(KVER|KSRC|ARCH|SUBARCH|CROSS_COMPILE|MODULE_NAME)|\$\(MAKE\)' \
            rtl8188eus/Makefile | head -30 || true

          echo "=== where this fork defines CONFIG_LITTLE_ENDIAN ==="
          grep -n 'CONFIG_LITTLE_ENDIAN' rtl8188eus/Makefile \
            || echo "  nowhere in the Makefile - KCFLAGS below is what supplies it"

          # Run 32518262085 failed here with 14 errors that all trace back to a
          # single missing preprocessor define:
          #   rtw_byteorder.h:30   "Must be LITTLE/BIG Endian Host"
          #   rtw_mlme_ext.h:1280  "Must be LITTLE or BIG Endian"
          #   rtw_security.c:748   no member named '_byte_' in 'union pn48'
          #   phydm_phystatus.h:52 'ODM_ENDIAN_TYPE' is not defined [-Wundef]
          # This Realtek Makefile only adds -DCONFIG_LITTLE_ENDIAN from inside a
          # CONFIG_PLATFORM_* block. Turning I386_PC off while ANDROID_ARM64
          # selects nothing in this fork left no platform active, so the define
          # never reached the compiler. union pn48 declares its _byte_ member
          # under that same #ifdef, which is why an endian problem surfaced as a
          # missing struct member.
          #
          # KCFLAGS is the right lever: the kernel Makefile appends it to
          # KBUILD_CFLAGS last, so the driver's own EXTRA_CFLAGS accumulation is
          # untouched. A command-line EXTRA_CFLAGS= would have overridden every
          # += in the Makefile and stripped CONFIG_IOCTL_CFG80211 with it.
          # Command-line variables reach the driver's inner $(MAKE) through
          # MAKEFLAGS - already proven, since that is how LLVM=1 and CC=clang
          # got there in the failing run.
          rc=0
          make -j"$(nproc)" -C rtl8188eus \
            KSRC="$PWD/out" ARCH=arm64 $KTC \
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN" \
            CONFIG_PLATFORM_I386_PC=n CONFIG_PLATFORM_ANDROID_ARM64=y 2>&1 \
            | tee /tmp/rtl.log || rc=$?

          if [ "$rc" != "0" ]; then
            echo "### dongle driver failed, rc=$rc"

            echo "=== compiler and linker diagnostics ==="
            grep -nE ' (error|fatal error):|^ld\.lld: error:|No such file|undefined (symbol|reference)|Nothing to be done|command not found' \
              /tmp/rtl.log | head -40 || echo "  nothing matched"

            echo "=== make failure lines ==="
            grep -nE '^make(\[[0-9]+\])?: \*\*\*' /tmp/rtl.log | head -20 || true

            echo "=== context around the first diagnostic ==="
            n=$(grep -nE ' (error|fatal error):|^ld\.lld: error:' /tmp/rtl.log \
              | head -1 | cut -d: -f1 || true)
            if [ -n "${n:-}" ]; then
              s=1
              [ "$n" -gt 30 ] && s=$((n - 30))
              sed -n "${s},$((n + 30))p" /tmp/rtl.log
            else
              echo "  no diagnostic matched - tail of the log follows:"
              tail -120 /tmp/rtl.log
            fi

            echo "=== log was $(wc -l < /tmp/rtl.log) lines ==="
          else
            find rtl8188eus -name '*.ko' -exec ls -l {} \;
          fi

          exit "$rc"

      - name: Install and package modules
        run: |
          set -eu
          make O=out ARCH=arm64 $KTC \
            INSTALL_MOD_PATH="$PWD/modinstall" INSTALL_MOD_STRIP=1 modules_install

          DEST=AnyKernel3/modules/vendor/lib/modules
          rm -rf AnyKernel3/modules
          mkdir -p "$DEST"

          # Package EVERY module the build produced. The hand-written allowlist
          # was the original mistake: it silently omitted camera.ko and the ~30
          # audio modules, which is exactly why camera and sound were dead.
          find modinstall -name '*.ko' -exec cp -f {} "$DEST/" \;

          # ---------------------------------------------------------------
          # qcacld-3.0 builds in-tree as wlan.o - its Kbuild sets
          # MODNAME := wlan whenever MODNAME arrives empty - so we get wlan.ko
          # while the phone loads qca_cld3_wlan.ko.
          #
          # A plain rename is correct, and here is the proof: lsmod on the
          # stock ROM reports the loaded module as "wlan", and modpost bakes
          # KBUILD_MODNAME into .gnu.linkonce.this_module, so a filename can
          # never change it. The stock file was therefore also built as wlan.o
          # with MULTI_IF_NAME left undefined, which is why
          # /vendor/firmware/wlan/ holds exactly one subdirectory, qca_cld.
          # Building with MODNAME=qca_cld3_wlan would instead DEFINE
          # MULTI_IF_NAME and send the driver hunting for a firmware directory
          # that does not exist. Do not "fix" this into an external build.
          # ---------------------------------------------------------------
          if [ -f "$DEST/wlan.ko" ]; then
            mv -f "$DEST/wlan.ko" "$DEST/qca_cld3_wlan.ko"
          fi

          find rtl8188eus -name '8188eu.ko' -exec cp -f {} "$DEST/" \; 2>/dev/null || true

          echo "=== packaged $(ls -1 "$DEST" | wc -l) modules ==="
          ls -1 "$DEST"

      - name: Assert vermagic matches the device byte for byte
        run: |
          set -eu
          DEST=AnyKernel3/modules/vendor/lib/modules
          probe="$DEST/camera.ko"
          if [ ! -f "$probe" ]; then
            probe=$(find "$DEST" -name '*.ko' | head -1)
          fi
          got=$(strings -a "$probe" | grep -m1 '^vermagic=' | sed 's/^vermagic=//')
          echo "probe  : $probe"
          echo "built  : $got"
          echo "device : $EXPECTED_VERMAGIC"
          if [ "$got" != "$EXPECTED_VERMAGIC" ]; then
            echo "::error::vermagic mismatch - the stock rdbg module would be refused."
            exit 1
          fi

      - name: Verify against the device inventory
        run: |
          set -eu
          DEST=AnyKernel3/modules/vendor/lib/modules

          # The exact contents of /vendor/lib/modules on the phone, 39 modules.
          # A word list and deliberately NOT a here-document: a heredoc body
          # inside a YAML block scalar has to be indented, which indents its
          # terminator too, which bash then never matches. The heredoc swallowed
          # the remainder of this step and it passed without checking anything,
          # and "bash -n" only warns about that, it does not fail. A
          # verification step that cannot fail is worse than none at all.
          DEVICE_MODULES="
          adsp_loader_dlkm apr_dlkm aw87xxx_dlkm aw882xx_dlkm bolero_cdc_dlkm
          bt_fm_slim btpower camera machine_dlkm mbhc_dlkm native_dlkm
          pa_manager_dlkm pinctrl_lpi_dlkm platform_dlkm q6_dlkm
          q6_notifier_dlkm q6_pdr_dlkm qca_cld3_wlan rdbg rmnet_core rmnet_ctl
          rmnet_offload rmnet_shs rx_macro_dlkm sia81xx_dlkm snd_event_dlkm
          stub_dlkm swr_ctrl_dlkm swr_dlkm tfa98xx-v6_dlkm tx_macro_dlkm
          va_macro_dlkm wcd937x_dlkm wcd937x_slave_dlkm wcd938x_dlkm
          wcd938x_slave_dlkm wcd9xxx_dlkm wcd_core_dlkm wsa881x_analog_dlkm
          "

          echo "=== device /vendor/lib/modules vs this build ==="
          built=0
          stock=0
          total=0
          for m in $DEVICE_MODULES; do
            total=$((total + 1))
            if [ -f "$DEST/$m.ko" ]; then
              echo "  built  $m.ko"
              built=$((built + 1))
            else
              echo "  STOCK  $m.ko  (kept - relies on matching vermagic)"
              stock=$((stock + 1))
            fi
          done
          echo "counted $total device modules: $built rebuilt, $stock left stock"
          if [ "$total" != "39" ]; then
            echo "::error::inventory list holds $total entries, expected 39 - typo in the list"
            exit 1
          fi

          # These decide whether Wi-Fi, Bluetooth, the camera and mobile data
          # work at all. If any is missing the zip is not worth flashing. The
          # rmnet four come from techpack/datarmnet/core and
          # techpack/datarmnet-ext/{offload,shs} behind an unconditional obj-m,
          # so a miss there means techpack was never descended into.
          missing=0
          for m in qca_cld3_wlan btpower bt_fm_slim camera \
                   rmnet_core rmnet_ctl rmnet_offload rmnet_shs; do
            if [ ! -f "$DEST/$m.ko" ]; then
              echo "::error::$m.ko was not built - the matching feature would be dead"
              missing=1
            fi
          done

          # We deliberately do NOT ship modules.load / modules.dep /
          # modules.alias / modules.softdep / modules.blocklist. The stock ones
          # encode a real load ORDER (audio has genuine dependencies) and an
          # alphabetical replacement would break boot. We only overwrite .ko
          # files by name. qca_cld3_wlan is absent from stock modules.load on
          # purpose - the Wi-Fi HAL insmods it on demand.
          exit "$missing"

      - name: Assemble the AnyKernel3 zip
        run: |
          set -eu
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          cd AnyKernel3
          zip -r9 "../NetHunter-Kernel-oscar-$(date -u +%Y%m%d-%H%M).zip" . -x '.git/*'

      # Inspects the finished artifact exactly the way it gets inspected before
      # flashing. Reported, not enforced: the hard gates above already stop a
      # genuinely broken build, and one absent vendor amplifier module must not
      # throw away an otherwise good kernel. Read this step's log before you
      # flash anything.
      - name: Verify the finished zip
        continue-on-error: true
        run: |
          set -eu
          z=$(ls -1 NetHunter-Kernel-oscar-*.zip | head -1)
          bash nethunter-verify-zip.sh "$z"

      - name: Report kernel identity
        run: |
          set -eu
          echo "release : $(cat out/include/config/kernel.release)"
          strings -a out/arch/arm64/boot/Image | grep -m1 'Linux version' || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-oscar
          path: |
            NetHunter-Kernel-oscar-*.zip
            nethunter_oscar_defconfig
            out/.config
