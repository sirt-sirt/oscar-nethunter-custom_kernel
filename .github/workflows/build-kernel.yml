name: Build NetHunter Kernel (oscar)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev libelf-dev
          sudo apt-get install -y curl git cpio flex bison
          
      - name: Download Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          
      - name: Fix permissions and broken symlinks
        run: |
          find . -name "*.sh" -exec chmod +x {} \;
          chmod +x scripts/kconfig/*
          chmod -R +x AnyKernel3/
          
      - name: Build Kernel
        run: |
          set -o pipefail
          export PATH=$(pwd)/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export ARCH=arm64
          
          # Prevent setlocalversion from appending git hash
          touch .scmversion
          
          # Build defconfig
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/holi-qgki_defconfig
          
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j$(nproc) 2>&1 | tee build.log

          echo "========================================="
          echo "   COMPILING OUT-OF-TREE VENDOR MODULES  "
          echo "========================================="
          
          # WLAN (qcacld-3.0)
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            M=drivers/staging/qcacld-3.0 CONFIG_QCA_CLD_WLAN=m -j$(nproc) || echo "WLAN Build Failed"

          # Techpack Audio
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            M=techpack/audio -j$(nproc) || echo "Audio Build Failed"

          # Techpack Camera
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            M=techpack/camera -j$(nproc) || echo "Camera Build Failed"

      - name: Diagnostic Info
        run: |
          echo "========================================="
          echo "         DIAGNOSTIC INFORMATION          "
          echo "========================================="
          echo "1. include/config/kernel.release:"
          cat out/include/config/kernel.release || echo "Not found"
          echo ""
          echo "2. Strings from Image (Linux version):"
          strings out/arch/arm64/boot/Image | grep "Linux version" || echo "Not found"
          echo ""
          echo "3. CONFIG_MODVERSIONS in .config:"
          grep "CONFIG_MODVERSIONS" out/.config || echo "Not found"
          echo ""
          echo "4. CONFIG_LOCALVERSION in .config:"
          grep "CONFIG_LOCALVERSION" out/.config || echo "Not found"
          echo "========================================="

      - name: Print real errors
        if: failure()
        run: |
          echo "========================================="
          echo "         ACTUAL ERRORS (grep)            "
          echo "========================================="
          grep -iE "(error[: ]|fatal|undefined reference|cannot find|no rule|FAILED)" build.log -B 3 -A 3 | tail -200 || true
          echo "=========================================="
          echo "         LAST 100 LINES OF BUILD LOG      "
          echo "=========================================="
          tail -100 build.log || true
          
      - name: Collect kernel modules & Create Magisk Module
        run: |
          mkdir -p AnyKernel3/modules
          # NetHunter specific modules (for AnyKernel3 ramdisk)
          find out/ -name "r8188eu.ko" -exec cp {} AnyKernel3/modules/ \;
          find out/ -name "rt2800usb.ko" -exec cp {} AnyKernel3/modules/ \;
          find out/ -name "rt2x00lib.ko" -exec cp {} AnyKernel3/modules/ \;
          find out/ -name "rt2x00usb.ko" -exec cp {} AnyKernel3/modules/ \;
          find out/ -name "rtl8xxxu.ko" -exec cp {} AnyKernel3/modules/ \;
          
          # Create Magisk Module structure for Vendor modules
          mkdir -p MagiskModule/system/vendor/lib/modules
          
          cat << 'EOF' > MagiskModule/module.prop
          id=nethunter-vendor-modules
          name=NetHunter Vendor Modules (Realme 9 Pro)
          version=v1.0
          versionCode=1
          author=Kali NetHunter
          description=Replaces vendor modules (WLAN, Camera, Audio) with kernel-matched versions to prevent ABI Kernel Panics.
          EOF
          
          # Collect vendor modules into Magisk zip
          find out/ -name "qca_cld3_wlan.ko" -exec cp {} MagiskModule/system/vendor/lib/modules/ \;
          find out/ -name "camera.ko" -exec cp {} MagiskModule/system/vendor/lib/modules/ \;
          find out/ -type f -name "*.ko" -path "out/techpack/audio/*" -exec cp {} MagiskModule/system/vendor/lib/modules/ \;
          
          echo "=== Magisk Module Contents ==="
          ls -la MagiskModule/system/vendor/lib/modules/

      - name: Package Zips
        run: |
          # Package AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../NetHunter-Kernel-oscar.zip *
          cd ..
          
          # Package Magisk Module
          cd MagiskModule
          zip -r9 ../NetHunter-Vendor-Modules.zip *
          cd ..
          
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload .config Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config
          path: out/.config

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-oscar
          path: NetHunter-Kernel-oscar.zip

      - name: Upload Magisk Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Vendor-Modules
          path: NetHunter-Vendor-Modules.zip
